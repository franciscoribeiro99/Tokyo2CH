name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file this. The more precise the repro, the faster the fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Include the exact error text if there was one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /contact
        2. Submit the form with an empty message
        3. Observe …
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected URL or route
      placeholder: /services

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Local development
        - Vercel preview deployment
        - Production
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on Fedora 43

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, console output, or a link to a failed CI run.
